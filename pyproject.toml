[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hq-x"
version = "0.1.0"
description = "Single business backend for outbound operations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
    "supabase>=2.9",
    "httpx>=0.27",
    # Cron parsing for the scheduled-task status engine (expected-fire math).
    "croniter>=2.0",
    "python-multipart>=0.0.9",
    "twilio>=9.0",
    "python-multipart>=0.0.9",
    # DMaaS: Cassowary constraint solver (same algorithm as @lume/kiwi) +
    # MCP wrapper + JSON Schema validation for scaffold prop_schemas.
    "kiwisolver>=1.4",
    "fastmcp>=2.0",
    "jsonschema>=4.21",
    # QR code rendering for per-recipient direct-mail pieces.
    "segno>=1.6",
    "rudder-sdk-python>=2.1.4",
    # Server-side template engine for the hosted DMaaS landing pages.
    "jinja2>=3.1",
    # First hq-x → Anthropic call site is the gtm-initiative strategy
    # synthesizer. Pinned ≥0.40 for the cache_control parameter shape.
    "anthropic>=0.40",
    # YAML front-matter parser used by the strategy synthesizer to
    # validate model output before persisting to disk.
    "PyYAML>=6.0",
    # Phase 2 contract substrate — audience-spec evaluator. PyIceberg +
    # DuckDB read against the dex catalog (R2-backed Iceberg). sqlglot
    # builds the WHERE clause from typed predicates without string
    # concat. boto3 writes the cohort-manifest parquet to R2 at sign
    # time. Catalog-load seam moves to Polaris when that ships.
    "pyiceberg[sql-postgres,s3fs]>=0.11",
    "duckdb>=1.5",
    "sqlglot>=25.0",
    "pyarrow>=18.0",
    "boto3>=1.35",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    # Phase 4 vector primitives + Phase 5 matching engine — numpy for cosine
    # similarity ops at scoring time. Phase 4's
    # app/services/audience_spec/vector_query.py imports numpy at module top;
    # without this pin the Railway image crashes on startup.
    "numpy>=1.26",
    # Phase 5 matching engine target-resolver — reads Lance datasets via the
    # Arrow-bridge pattern (pylance → pyarrow.Table → DuckDB.register).
    # See app/services/matching_engine/engine.py::_read_lance_with_filters.
    "pylance>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` is idiomatic in default arguments.
"app/auth/roles.py" = ["B008"]
"app/routers/**/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
