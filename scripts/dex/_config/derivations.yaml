  # USAspending officers — unpivoted from the 5 (name, amount) column pairs.
  # One row per (contract, officer_rank), filtered to non-null officer_name.
  # Officer disclosure is required only for recipients above certain
  # compensation thresholds, so this is a much smaller table than contracts
  # itself.
  - name: usaspending_officers_unified
    description: |
      Officer-grain rows extracted from the contracts_unified data. Each
      contract that discloses its top-5 highly-compensated officers
      produces up to 5 rows here (one per disclosed officer), keyed by
      award_id_piid + officer_rank. Comp amounts cast to DOUBLE.
    input:
      r2_prefix: usaspending/contracts
      snapshot_mode: static
    transform_sql: |
      WITH base AS (
        SELECT
          award_id_piid, year, action_date, recipient_name, recipient_uei,
          recipient_duns, recipient_parent_uei, recipient_parent_name,
          recipient_city_name, recipient_state_code, recipient_zip_4_code,
          naics_code, naics_description, federal_action_obligation,
          transaction_description,
          highly_compensated_officer_1_name, highly_compensated_officer_1_amount,
          highly_compensated_officer_2_name, highly_compensated_officer_2_amount,
          highly_compensated_officer_3_name, highly_compensated_officer_3_amount,
          highly_compensated_officer_4_name, highly_compensated_officer_4_amount,
          highly_compensated_officer_5_name, highly_compensated_officer_5_amount
        FROM read_parquet(
          'r2://dex-raw-landing-zone/usaspending/contracts/year=*/data.parquet',
          union_by_name = true,
          hive_partitioning = true
        )
        WHERE highly_compensated_officer_1_name IS NOT NULL
           OR highly_compensated_officer_2_name IS NOT NULL
           OR highly_compensated_officer_3_name IS NOT NULL
           OR highly_compensated_officer_4_name IS NOT NULL
           OR highly_compensated_officer_5_name IS NOT NULL
      ),
      rank1 AS (
        SELECT award_id_piid, year, action_date, recipient_name, recipient_uei,
               recipient_duns, recipient_parent_uei, recipient_parent_name,
               recipient_city_name, recipient_state_code, recipient_zip_4_code,
               naics_code, naics_description, federal_action_obligation,
               transaction_description,
               1 AS officer_rank,
               highly_compensated_officer_1_name AS officer_name,
               TRY_CAST(highly_compensated_officer_1_amount AS DOUBLE) AS officer_amount
        FROM base WHERE highly_compensated_officer_1_name IS NOT NULL
                    AND highly_compensated_officer_1_name <> ''
      ),
      rank2 AS (
        SELECT award_id_piid, year, action_date, recipient_name, recipient_uei,
               recipient_duns, recipient_parent_uei, recipient_parent_name,
               recipient_city_name, recipient_state_code, recipient_zip_4_code,
               naics_code, naics_description, federal_action_obligation,
               transaction_description,
               2 AS officer_rank,
               highly_compensated_officer_2_name AS officer_name,
               TRY_CAST(highly_compensated_officer_2_amount AS DOUBLE) AS officer_amount
        FROM base WHERE highly_compensated_officer_2_name IS NOT NULL
                    AND highly_compensated_officer_2_name <> ''
      ),
      rank3 AS (
        SELECT award_id_piid, year, action_date, recipient_name, recipient_uei,
               recipient_duns, recipient_parent_uei, recipient_parent_name,
               recipient_city_name, recipient_state_code, recipient_zip_4_code,
               naics_code, naics_description, federal_action_obligation,
               transaction_description,
               3 AS officer_rank,
               highly_compensated_officer_3_name AS officer_name,
               TRY_CAST(highly_compensated_officer_3_amount AS DOUBLE) AS officer_amount
        FROM base WHERE highly_compensated_officer_3_name IS NOT NULL
                    AND highly_compensated_officer_3_name <> ''
      ),
      rank4 AS (
        SELECT award_id_piid, year, action_date, recipient_name, recipient_uei,
               recipient_duns, recipient_parent_uei, recipient_parent_name,
               recipient_city_name, recipient_state_code, recipient_zip_4_code,
               naics_code, naics_description, federal_action_obligation,
               transaction_description,
               4 AS officer_rank,
               highly_compensated_officer_4_name AS officer_name,
               TRY_CAST(highly_compensated_officer_4_amount AS DOUBLE) AS officer_amount
        FROM base WHERE highly_compensated_officer_4_name IS NOT NULL
                    AND highly_compensated_officer_4_name <> ''
      ),
      rank5 AS (
        SELECT award_id_piid, year, action_date, recipient_name, recipient_uei,
               recipient_duns, recipient_parent_uei, recipient_parent_name,
               recipient_city_name, recipient_state_code, recipient_zip_4_code,
               naics_code, naics_description, federal_action_obligation,
               transaction_description,
               5 AS officer_rank,
               highly_compensated_officer_5_name AS officer_name,
               TRY_CAST(highly_compensated_officer_5_amount AS DOUBLE) AS officer_amount
        FROM base WHERE highly_compensated_officer_5_name IS NOT NULL
                    AND highly_compensated_officer_5_name <> ''
      )
