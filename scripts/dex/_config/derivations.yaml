  - name: fmcsa_carrier_inspection_state_footprint
    description: |
      Per-(dot_number, report_state) inspection rollup from
      fmcsa_vehicle_inspection_essentials. Powers the "where do they run?"
      lane-color signal. Replaces build_fmcsa_carrier_inspection_state_footprint.py.
      Smoke ceiling is generous; this depends on fmcsa_vehicle_inspection_essentials
      having been built for the same snapshot date.
    input:
      r2_prefix: fmcsa-derived/vehicle_inspection_essentials
      snapshot_layout: hive
      file_pattern: "data.parquet"
    transform_sql: |
      SELECT
        dot_number,
        report_state,
        count(*)::BIGINT AS inspection_count,
        min(insp_date)   AS first_inspection_date,
        max(insp_date)   AS last_inspection_date,
        count(*) FILTER (
          WHERE TRY_CAST(strptime(insp_date, '%Y%m%d') AS DATE)
                >= current_date - INTERVAL 365 DAY
        )::BIGINT AS inspection_count_last_365d,
        COALESCE(SUM(TRY_CAST(viol_total         AS BIGINT)), 0)::BIGINT AS viol_total_sum,
        COALESCE(SUM(TRY_CAST(oos_total          AS BIGINT)), 0)::BIGINT AS oos_total_sum,
        COALESCE(SUM(TRY_CAST(driver_viol_total  AS BIGINT)), 0)::BIGINT AS driver_viol_sum,
        COALESCE(SUM(TRY_CAST(vehicle_viol_total AS BIGINT)), 0)::BIGINT AS vehicle_viol_sum,
        COALESCE(SUM(TRY_CAST(hazmat_viol_total  AS BIGINT)), 0)::BIGINT AS hazmat_viol_sum
      FROM read_parquet('{input_glob}')
      WHERE dot_number IS NOT NULL
        AND TRIM(dot_number) <> ''
        AND report_state IS NOT NULL
        AND TRIM(report_state) <> ''
      GROUP BY dot_number, report_state
    output:
      r2_prefix: fmcsa-derived/carrier_inspection_state_footprint
      snapshot_naming: source_date
      compression: zstd
      row_group_size: 100000
    smoke:
      expected_min: 500000
      expected_max: 5000000

  # ──────────────────────────────────────────────────────────────────────
  # FMCSA pass-through derivations — 10 raw prefixes previously unwired.
